<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <header class="site-header" lang="de">
        <div class="header-inner">
          <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span>KK CONSTRUCTION GbR.</span></a>
          <nav aria-label="Hauptnavigation">
            <a href="#top" aria-current="location">Home</a>
            <a href="#services">Leistungen</a>
            <a href="#about">Über uns</a>
            <a href="#approach">Warum wir</a>
            <a href="#visualisierungen">Visualisierungen</a>
            <a href="#contact">Kontakt</a>
          </nav>
          <a class="header-quote" href="#contact">Angebot anfordern</a>
        </div>
      </header>
      <main>
        <section class="hero" id="top">
          <picture class="hero-picture">
            <source media="(max-width: 600px)" srcset="/images/villa-mobile.webp" />
            <img class="hero-image" src="/images/villa-dusk.webp" srcset="/images/villa-dusk-800.webp 800w, /images/villa-dusk.webp 1800w" sizes="100vw" alt="" />
          </picture>
          <span class="hero-image-note">KI-generiertes Bild</span>
          <div class="wrap hero-content">
            <span class="eyebrow">Qualität. Zuverlässigkeit. Präzision.</span>
            <h1 class="hero-title">BAUEN MIT<br />PRÄZISION</h1>
            <p>Hochwertige Bau- und Montageservices für private und gewerbliche Kunden in ganz Deutschland.</p>
            <div class="hero-actions">
              <a class="button" href="#contact">Kostenloses Angebot</a>
              <a class="hero-gallery-link" href="#visualisierungen">Visualisierungen ansehen</a>
            </div>
          </div>
        </section>
        <section class="wrap section services-section" id="services">
          <h2 class="eyebrow">Unsere Leistungen</h2>
          <div class="services">
            <article>
              <img class="service-icon" src="/images/service-drywall.svg" width="80" height="72" alt="" />
              <h3>Trockenbau</h3><p>Innenausbau mit höchster Präzision</p>
            </article>
            <article>
              <img class="service-icon" src="/images/service-flooring.svg" width="80" height="72" alt="" />
              <h3>Bodenbeläge</h3><p>Verlegung aller Bodenarten, sauber und fachgerecht</p>
            </article>
            <article>
              <img class="service-icon" src="/images/service-assembly.svg" width="80" height="72" alt="" />
              <h3>Montagearbeiten</h3><p>Professionelle Montage und Installation</p>
            </article>
            <article>
              <img class="service-icon" src="/images/service-demolition.svg" width="80" height="72" alt="" />
              <h3>Demontagearbeiten</h3><p>Rückbau und Demontage, sicher und effizient</p>
            </article>
            <article>
              <img class="service-icon" src="/images/service-protection.svg" width="80" height="72" alt="" />
              <h3>Holz- und Bautenschutz</h3><p>Schutz und Pflege für langfristige Qualität</p>
            </article>
          </div>
        </section>
        <div class="company-overview">
          <figure class="company-illustration">
            <img src="/images/company-interior.webp" alt="Wohnraum mit dunklem Holz und warmem Licht" loading="lazy" />
            <figcaption>KI-generiertes Bild</figcaption>
          </figure>
          <section class="company-copy" id="about">
            <span class="eyebrow">Über uns</span>
            <h2>Qualität, auf die Sie bauen können</h2>
            <p>KK Construction GbR widmet sich Neubau, Renovierung und Innenausbau. Im Mittelpunkt steht die Frage, wie Sie Ihre Räume nutzen möchten.</p>
          </section>
          <section class="company-copy" id="approach">
            <h2 class="eyebrow">Warum wir</h2>
            <ul class="approach-list">
              <li><svg class="approach-icon" aria-hidden="true"><use href="/images/approach-icons.svg#craft"></use></svg>Präzise Handwerksarbeit</li>
              <li><svg class="approach-icon" aria-hidden="true"><use href="/images/approach-icons.svg#materials"></use></svg>Sorgfältige Materialauswahl</li>
              <li><svg class="approach-icon" aria-hidden="true"><use href="/images/approach-icons.svg#planning"></use></svg>Verlässliche Projektplanung</li>
              <li><svg class="approach-icon" aria-hidden="true"><use href="/images/approach-icons.svg#tag"></use></svg>Transparente Kommunikation</li>
            </ul>
          </section>
        </div>
        <section class="gallery-section" id="visualisierungen" aria-labelledby="visualizations-title" aria-describedby="visualizations-note">
          <div class="wrap section">
            <span class="eyebrow">Visualisierungen</span>
            <h2 id="visualizations-title">Architektur &amp; Raumkonzepte</h2>
            <div class="project-grid">
              <!-- gallery-photos -->
            </div>
            <p class="visualizations-note" id="visualizations-note">Die gezeigten Bilder dienen der Veranschaulichung möglicher Bau- und Gestaltungskonzepte. Sie stellen keine tatsächlich von KK Construction GbR ausgeführten Referenzprojekte dar.</p>
          </div>
        </section>
        <section class="wrap section contact" id="contact">
          <div>
            <span class="eyebrow">Kontakt</span>
            <h2>Lassen Sie uns Ihr Projekt verwirklichen</h2>
            <p class="section-intro">Erzählen Sie uns von Ihrem Vorhaben – wir melden uns mit einem unverbindlichen Angebot.</p>
            <div class="contact-details">
              <a href="tel:+4915773565328"><svg aria-hidden="true"><use href="/images/contact-icons.svg#phone"></use></svg><span>+49 157 735 653 28</span></a>
              <a href="mailto:info@kk-construction.de"><svg aria-hidden="true"><use href="/images/contact-icons.svg#mail"></use></svg><span>info@kk-construction.de</span></a>
              <div><svg aria-hidden="true"><use href="/images/contact-icons.svg#location"></use></svg><span>Deutschland</span></div>
            </div>
            <p class="contact-privacy">Informationen zur Verarbeitung Ihrer Angaben finden Sie in der <a class="privacy-link" href="./datenschutz/">Datenschutzerklärung</a>.</p>
          </div>
          <!-- project-inquiry-fallback -->
          <div class="contact-brand">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
            <span>KK CONSTRUCTION GbR.</span>
          </div>
        </section>

      <footer class="site-footer" lang="de">
        <div class="footer-inner">
          <div class="footer-brand">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
            <div>
              <strong>KK CONSTRUCTION GbR.</strong><small>© KK Construction GbR. Alle Rechte vorbehalten.</small>

            </div>
          </div>
          <nav aria-label="Fußnavigation">
            <a href="#top">Home</a>
            <a href="#services">Leistungen</a>
            <a href="#about">Über uns</a>
            <a href="#visualisierungen">Visualisierungen</a>
            <a href="#contact">Kontakt</a>
          </nav>
          <p class="footer-image-note">Bildhinweis: Auf dieser Website werden teilweise KI-generierte und KI-bearbeitete Bilder zu Illustrationszwecken verwendet.</p>
        </div>
      </footer>
