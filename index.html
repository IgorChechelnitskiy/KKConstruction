<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KK Construction GbR bietet Bau- und Montageservices. Entdecken Sie Projektideen und fragen Sie ein Angebot an." />
    <title>KK Construction | Bauen mit Präzision</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/animation.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <header class="site-header" lang="de">
        <div class="header-inner">
          <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span>KK CONSTRUCTION GbR.</span></a>
          <nav aria-label="Hauptnavigation">
            <a href="#top" aria-current="location">Home</a>
            <a href="#about">Über uns</a>
            <a href="#services">Leistungen</a>
            <a href="#gallery">Projekte</a>
            <a href="#approach">Warum wir</a>
            <a href="#contact">Kontakt</a>
          </nav>
          <a class="header-quote" href="#contact">Angebot anfordern</a>
        </div>
      </header>
      <main>
        <section class="hero" id="top">
          <picture class="hero-picture">
            <source media="(max-width: 600px)" srcset="/images/villa-mobile.jpg" />
            <img class="hero-image" src="/images/villa-dusk.jpg" srcset="/images/villa-dusk-800.jpg 800w, /images/villa-dusk.jpg 1800w" sizes="100vw" alt="" />
          </picture>
          <div class="wrap hero-content">
            <span class="eyebrow">Qualität. Zuverlässigkeit. Präzision.</span>
            <h1 class="hero-title">BAUEN MIT<br />PRÄZISION</h1>
            <p>Hochwertige Bau- und Montageservices für private und gewerbliche Kunden in ganz Deutschland.</p>
            <div class="hero-actions">
              <a class="button" href="#contact">Kostenloses Angebot</a>
              <a class="hero-gallery-link" href="#gallery">Unsere Arbeiten ansehen</a>
            </div>
          </div>
        </section>
        <section class="wrap section services-section" id="services">
          <h2 class="eyebrow">Unsere Leistungen</h2>
          <div class="services">
            <article><h3>Trockenbau</h3><p>Innenausbau mit höchster Präzision</p></article>
            <article><h3>Bodenbeläge</h3><p>Verlegung aller Bodenarten, sauber und fachgerecht</p></article>
            <article><h3>Montagearbeiten</h3><p>Professionelle Montage und Installation</p></article>
            <article><h3>Demontagearbeiten</h3><p>Rückbau und Demontage, sicher und effizient</p></article>
            <article><h3>Holz- und Bautenschutz</h3><p>Schutz und Pflege für langfristige Qualität</p></article>
          </div>
        </section>
        <div class="company-overview">
          <img src="/images/company-interior.jpg" alt="Wohnraum mit dunklem Holz und warmem Licht" loading="lazy" />
          <section class="company-copy" id="about">
            <span class="eyebrow">Über uns</span>
            <h2>Qualität, auf die Sie bauen können</h2>
            <p>KK Construction GbR widmet sich Neubau, Renovierung und Innenausbau. Im Mittelpunkt steht die Frage, wie Sie Ihre Räume nutzen möchten.</p>
          </section>
          <section class="company-copy" id="approach">
            <h2 class="eyebrow">Warum wir</h2>
            <ul class="approach-list">
              <li>Präzise Handwerksarbeit</li>
              <li>Sorgfältige Materialauswahl</li>
              <li>Verlässliche Projektplanung</li>
              <li>Transparente Kommunikation</li>
            </ul>
          </section>
        </div>
        <section class="gallery-section" id="gallery">
          <div class="wrap section">
            <span class="eyebrow">Unsere Projekte</span>
            <h2>Ausgewählte Projektideen</h2>
            <div class="project-grid">
              <img src="/images/project-villa.jpg" alt="Moderne Villa mit beleuchteter Glasfassade" loading="lazy" />
              <img src="/images/project-pool.jpg" alt="Betonvilla mit Terrasse und Pool" loading="lazy" />
              <img src="/images/project-kitchen.jpg" alt="Küche mit dunkler Holzverkleidung und Steininsel" loading="lazy" />
              <img src="/images/project-aerial.jpg" alt="Zeitgenössisches Wohnhaus mit Terrasse aus erhöhter Perspektive" loading="lazy" />
            </div>
          </div>
        </section>
        <section class="wrap section contact" id="contact">
          <div><span class="eyebrow">Kontakt</span><h2>Lassen Sie uns Ihr Projekt verwirklichen</h2><p class="section-intro">Erzählen Sie uns von Ihrem Vorhaben. Wir melden uns mit einem unverbindlichen Angebot.</p></div>
          <!-- project-inquiry-fallback -->
          <div class="contact-brand">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
            <span>KK CONSTRUCTION GbR.</span>
          </div>
        </section>
      </main>
      <footer class="site-footer" lang="de">
        <div class="footer-inner">
          <div class="footer-brand">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
            <div><strong>KK CONSTRUCTION GbR.</strong><small>© KK Construction GbR. Alle Rechte vorbehalten.</small></div>
          </div>
          <nav aria-label="Fußnavigation">
            <a href="#top">Home</a>
            <a href="#about">Über uns</a>
            <a href="#services">Leistungen</a>
            <a href="#gallery">Projekte</a>
            <a href="#contact">Kontakt</a>
          </nav>
        </div>
      </footer>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
